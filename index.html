<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blue House | Live Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#071b33;color:white;font-family:Arial,sans-serif;text-align:center;padding:24px 12px}h1{color:#d9b76e;letter-spacing:3px;margin-bottom:5px}.subtitle{color:#aebed0;font-size:14px}#reader{max-width:500px;width:100%;margin:20px auto;border-radius:16px;overflow:hidden;background:#102944}#reader video{width:100%!important;object-fit:cover}button{background:#d9b76e;color:#071b33;border:0;border-radius:12px;padding:16px 24px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}button:disabled{opacity:.5}#result{background:#102944;border:1px solid #d9b76e;padding:20px;border-radius:14px;max-width:500px;margin:20px auto;overflow-wrap:anywhere;line-height:1.6}.success{color:#61e6a3}.error{color:#ff9999}#count{color:#d9b76e;font-size:26px;font-weight:bold}#status{color:#aebed0;font-size:13px}</style></head>
<body><h1>BLUE HOUSE</h1><p class="subtitle">SMART ATTENDANCE · LIVE SCANNER</p><button id="startBtn">START LIVE SCANNER</button><button id="stopBtn" hidden>STOP CAMERA</button><div id="reader"></div><div id="result">Open this scanner using OPEN LIVE PHONE SCANNER inside your verified Teacher Dashboard.</div><p>Detected scans: <span id="count">0</span></p><p id="status">Camera inactive</p>
<script>
let scanner=null,lastCode="",lastScan=0,count=0,running=false;
const startBtn=document.getElementById("startBtn"),stopBtn=document.getElementById("stopBtn"),result=document.getElementById("result"),statusEl=document.getElementById("status"),countEl=document.getElementById("count");
function showMessage(message,className=""){result.textContent=message;result.className=className;}
function onDetected(code){if(!running)return;code=String(code||"").trim();if(!/^[a-f0-9]{64}$/i.test(code))return;const now=Date.now();if(code===lastCode&&now-lastScan<8000)return;lastCode=code;lastScan=now;count++;countEl.textContent=count;if(window.opener&&!window.opener.closed){try{window.opener.postMessage({type:"blueHouseExternalQr",token:code},"*");showMessage("✓ QR detected. Sent to Teacher Dashboard for verification.","success");statusEl.textContent="Check the dashboard for saved attendance. Ready for next student.";}catch(e){showMessage("QR detected, but the dashboard connection failed. Reopen this scanner from the dashboard.","error");}}else{showMessage("QR detected, but no dashboard connection. Open this scanner from the Teacher Dashboard button.","error");}if(navigator.vibrate)navigator.vibrate(150);}
startBtn.onclick=async()=>{if(running)return;startBtn.disabled=true;showMessage("Opening camera...");statusEl.textContent="Requesting camera access...";try{if(!window.Html5Qrcode)throw new Error("QR scanner library failed to load.");scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false,useBarCodeDetectorIfSupported:true});await scanner.start({facingMode:"environment"},{fps:20,qrbox:(w,h)=>{const size=Math.floor(Math.min(w*.92,h*.92,380));return{width:size,height:size};},disableFlip:false,aspectRatio:1.333334,videoConstraints:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}},onDetected,()=>{});running=true;startBtn.hidden=true;stopBtn.hidden=false;showMessage("Camera active. Point at a student QR badge.");statusEl.textContent="LIVE SCANNING ACTIVE";}catch(error){running=false;showMessage("Camera error: "+(error?.message||String(error)),"error");statusEl.textContent="Unable to start scanner";startBtn.disabled=false;}};
stopBtn.onclick=async()=>{running=false;stopBtn.disabled=true;try{if(scanner){await scanner.stop();scanner.clear();scanner=null;}}catch(error){console.error(error);}stopBtn.hidden=true;stopBtn.disabled=false;startBtn.hidden=false;startBtn.disabled=false;showMessage("Scanner stopped.");statusEl.textContent="Camera inactive";};
</script></body></html>
